      <div class="target-row collapsed" id="w-target-box">
        <span class="target-label">🎯 目标</span>
        <input class="input" id="w-target" type="number" step="0.1" placeholder="斤" style="max-width:90px;" />
        <button class="btn btn-ghost btn-sm" id="w-target-set">设定</button>
        <button class="btn btn-ghost btn-sm" id="w-target-clear">清除</button>
      </div>

      <div id="w-stats"></div>
      <div class="ai-card" id="w-ai"></div>
      <div class="w-list-head">📋 历史记录</div>
      <ul class="item-list" id="w-list"></ul>
    </div>`;

  let W = { items: [], target: null, by_date: {}, avg: null, daily: null, count: 0, c7: null, c14: null, c30: null, summary: '' };
  let chartDrawn = false;

  document.getElementById('w-trend').onclick = function () {
    const wrap = document.getElementById('w-chart-wrap');
    const hidden = wrap.classList.toggle('collapsed');
    this.classList.toggle('active', !hidden);
    if (!hidden && !chartDrawn) { drawChart(W.items, W.target); chartDrawn = true; }
  };
  document.getElementById('w-cal').onclick = () => document.getElementById('w-date').classList.toggle('collapsed');
  document.getElementById('w-target-open').onclick = () => document.getElementById('w-target-box').classList.toggle('collapsed');
  document.getElementById('wc-prev').onclick = () => { calM--; if (calM < 1) { calM = 12; calY--; } renderCal(); };
  document.getElementById('wc-next').onclick = () => { calM++; if (calM > 12) { calM = 1; calY++; } renderCal(); };

  enterToSubmit('w-add');
  document.getElementById('w-add').onclick = async function () {
    const v = document.getElementById('w-val').value;
    if (!v) { toast('请输入体重'); return; }
    await withBtn(this, async () => {
      try {
        await api('/api/weight', 'POST', { date: document.getElementById('w-date').value || undefined, weight: v, period: document.getElementById('w-period').value, note: document.getElementById('w-note').value });
        document.getElementById('w-val').value = ''; document.getElementById('w-note').value = '';
        toast('✅ 已记录'); load();
      } catch (e) { toast(e.message); }
    });
  };
  document.getElementById('w-target-set').onclick = async function () {
    const t = document.getElementById('w-target').value;
    if (!t) { toast('请输入目标体重'); return; }
    await withBtn(this, async () => {
      try { await api('/api/weight', 'PUT', { target: parseFloat(t) }); toast('🎯 目标已设定'); load(); }
      catch (e) { toast(e.message); }
    });
  };
  document.getElementById('w-target-clear').onclick = async function () {
    await withBtn(this, async () => {
      try { await api('/api/weight', 'PUT', { target: null }); toast('已清除目标线'); load(); }
      catch (e) { toast(e.message); }
    });
  };

  function renderCal() {
    document.getElementById('wc-title').textContent = `${calY} 年 ${calM} 月`;
    const firstDow = (new Date(calY, calM - 1, 1).getDay() + 6) % 7;
    const dim = new Date(calY, calM, 0).getDate();
    const today = todayISO();
    const wnames = ['一', '二', '三', '四', '五', '六', '日'];
    let grid = '';
    for (let i = 0; i < firstDow; i++) grid += `<div class="wc-cell empty"></div>`;
    for (let d = 1; d <= dim; d++) {
      const ds = `${calY}-${String(calM).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const rec = W.by_date[ds];
      let cls = 'wc-cell';
      if (ds === today) cls += ' today';
      let inner = `<div class="wc-d">${d}</div>`;
      if (rec) {
        inner += `<div class="wc-w">${rec.weight}</div>`;
        if (rec.delta !== null && rec.delta !== undefined) {
          if (rec.delta < 0) { cls += ' down'; inner += `<div class="wc-delta dn">↓${Math.abs(rec.delta)}</div>`; }
          else if (rec.delta > 0) { cls += ' up'; inner += `<div class="wc-delta up2">↑${rec.delta}</div>`; }
          else { cls += ' flat'; inner += `<div class="wc-delta">→0</div>`; }
        }
      }
      grid += `<div class="${cls}" data-date="${ds}">${inner}</div>`;
    }
    document.getElementById('w-cal-grid').innerHTML = `
      <div class="wc-weekhead">${wnames.map(w => `<span>${w}</span>`).join('')}</div>
      <div class="wc-grid">${grid}</div>`;
    document.getElementById('w-cal-grid').querySelectorAll('.wc-cell[data-date]').forEach(c => {
      c.onclick = () => {
        document.getElementById('w-date').value = c.dataset.date;
        document.getElementById('w-date').classList.remove('collapsed');
        document.getElementById('w-val').focus();
      };
    });
  }

  function statsHtml() {
    const bar = (label, val, ref) => {
      const v = (val == null) ? 0 : val;
      const pct = Math.max(5, Math.min(100, Math.round(Math.abs(v) / ref * 100)));
      const color = v < 0 ? 'var(--mint)' : (v > 0 ? 'var(--pink)' : 'var(--line)');
      const sign = v > 0 ? '+' : '';
      return `<div class="ws-row">
        <div class="ws-label">${label}</div>
        <div class="ws-track"><span style="width:${pct}%;background:${color}"></span></div>
        <div class="ws-val" style="color:${color}">${val == null ? '—' : sign + v + ' 斤'}</div>
      </div>`;
    };
    const dColor = W.daily < 0 ? 'var(--mint)' : (W.daily > 0 ? 'var(--pink)' : 'var(--text)');
    return `<div class="ws-card">
      <div class="ws-head">📈 趋势分析</div>
      <div class="ws-kpis">
        <div class="ws-kpi"><div class="ws-kpi-v">${W.avg ?? '—'}</div><div class="ws-kpi-l">平均体重 斤</div></div>
        <div class="ws-kpi"><div class="ws-kpi-v" style="color:${dColor}">${W.daily == null ? '—' : (W.daily > 0 ? '+' : '') + W.daily}</div><div class="ws-kpi-l">日均变化 斤</div></div>
        <div class="ws-kpi"><div class="ws-kpi-v">${W.count}</div><div class="ws-kpi-l">记录天数</div></div>
      </div>
      ${bar('近 7 天', W.c7, 3)}
      ${bar('近 14 天', W.c14, 5)}
      ${bar('近 30 天', W.c30, 8)}
    </div>`;
  }

  async function load() {
    const data = await api('/api/weight');
    W.items = data.items; W.target = data.target; W.by_date = data.by_date || {};
    W.avg = data.avg_weight; W.daily = data.daily_avg; W.count = data.count;
    W.c7 = data.change_7; W.c14 = data.change_14; W.c30 = data.change_30; W.summary = data.summary || '';

    const latestDate = W.items.length ? W.items[W.items.length - 1].date : null;
    const latestDelta = (latestDate && W.by_date[latestDate]) ? W.by_date[latestDate].delta : null;
    const diff = (data.target != null && data.latest != null) ? (data.latest - data.target).toFixed(1) : null;
    const deltaTxt = data.month_change != null ? (data.month_change > 0 ? '+' : '') + data.month_change : '—';
    const diffTxt = diff != null ? (diff > 0 ? '+' : '') + diff : '—';
    const diffColor = diff != null && diff > 0 ? '#e06b70' : '#4a9b7c';
    document.getElementById('w-big').innerHTML = `${data.latest ?? '—'}<span class="w-unit">斤</span>`;
    const dChip = (latestDelta !== null && latestDelta !== undefined)
      ? `<span class="w-pill">📅 较上次 <b style="color:${latestDelta < 0 ? '#4a9b7c' : (latestDelta > 0 ? '#e06b70' : 'var(--text)')}">${latestDelta < 0 ? '↓' + Math.abs(latestDelta) : (latestDelta > 0 ? '↑' + latestDelta : '→0')}</b> 斤</span>`
      : '';
    document.getElementById('w-pills').innerHTML = `
      ${dChip}
      <span class="w-pill">📅 近30天 <b style="color:${diffColor}">${deltaTxt}</b> 斤</span>
      ${data.target != null
        ? `<span class="w-pill">🎯 还差 <b style="color:${diffColor}">${diffTxt}</b> 斤</span>`
        : `<span class="w-pill" style="opacity:.7">未设目标 · 点 🎯</span>`}`;

    renderCal();

    const wrap = document.getElementById('w-chart-wrap');
    if (!wrap.classList.contains('collapsed') && window.Chart) { drawChart(W.items, W.target); chartDrawn = true; }

    document.getElementById('w-stats').innerHTML = statsHtml();
    document.getElementById('w-ai').innerHTML = `
      <div class="ai-head">🤖 AI 智能总结</div>
      <div class="ai-body">${(W.summary || '').split('\n').filter(Boolean).map(l => `<p>${esc(l)}</p>`).join('')}</div>`;

    const list = document.getElementById('w-list');
    if (!W.items.length) { list.innerHTML = `<div class="empty">暂无记录，今天称个体重吧 ⚖️</div>`; return; }
    let prev = null;
    list.innerHTML = W.items.slice().reverse().map((it, i) => {
      let d = '';
      if (prev !== null) { const v = (it.weight - prev).toFixed(1); d = v > 0 ? `↑+${v}` : (v < 0 ? `↓${v}` : '→0'); }
      prev = it.weight;
      return `<li class="item-card" style="animation-delay:${i * 0.03}s">
        <div class="item-main">
          <div class="item-title">${it.weight} 斤 <span class="tag tag-yellow">${d}</span> <span class="tag tag-blue">${it.period}</span> <span class="tag" style="background:var(--cream);color:var(--text-light)">${fmtMD(it.date)}</span></div>
          ${it.note ? `<div class="item-meta">📝 ${esc(it.note)}</div>` : ''}
        </div>
        <button class="del-btn" data-del="${it.id}">🗑</button>
      </li>`;
    }).join('');
    list.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { await api('/api/weight?id=' + b.dataset.del, 'DELETE'); load(); });
  }
  function loadChartJS() {
    return new Promise((resolve) => {
      if (window.Chart) return resolve();
      const s = document.createElement('script');
      s.src = '/static/js/chart.umd.min.js';
      s.onload = () => resolve();
      s.onerror = () => resolve();
      document.head.appendChild(s);
    });
  }
  async function drawChart(items, target) {
    const ctx = document.getElementById('w-chart');
    if (!ctx) return;
    await loadChartJS();
    if (!window.Chart) return;
    if (weightChart) weightChart.destroy();
    const sorted = [...items].sort((a, b) => a.date.localeCompare(b.date));
    const datasets = [{ label: '体重', data: sorted.map(i => i.weight), borderColor: '#E8B4B8', backgroundColor: 'rgba(232,180,184,0.12)', fill: true, tension: 0.35, pointRadius: 3, pointBackgroundColor: '#E8B4B8', borderWidth: 2.5 }];
    if (target != null) datasets.push({ label: '🎯 目标', data: sorted.map(() => target), borderColor: '#A6D1E6', borderDash: [6, 6], pointRadius: 0, borderWidth: 2, fill: false });
    weightChart = new Chart(ctx, {
      type: 'line',
      data: { labels: sorted.map(i => fmtMD(i.date)), datasets },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: target != null, labels: { boxWidth: 12, font: { size: 11 }, usePointStyle: true } } }, scales: { y: { grid: { color: 'rgba(232,180,184,0.1)' } }, x: { grid: { display: false } } }, interaction: { mode: 'index', intersect: false } }
    });
  }
  load();
};

// ── 追剧 ──
RENDERERS.shows = async function () {
  const el = document.getElementById('content-area');
  el.innerHTML = `
    <div class="page-card">
      ${head('🍿', '追剧清单', '豆瓣推荐 · 手动添加 · 精简视图')}
      <div class="rec-bar">
        <button class="btn btn-ghost btn-sm" id="s-toggle-rec">🔍 获取豆瓣推荐</button>
        <div id="s-rec-panel" style="display:none;gap:8px;align-items:center;flex-wrap:wrap;width:100%;margin-top:8px;">
          <select class="select" id="s-kind" style="max-width:90px;"><option value="tv">剧集</option><option value="movie">电影</option></select>
          <select class="select" id="s-tag" style="max-width:100px;"><option>热门</option><option>最新</option><option>高分</option><option>华语</option></select>
          <button class="btn btn-primary btn-sm" id="s-rec">搜索</button>
        </div>
      </div>
      <div id="s-rec-list" class="rec-grid" style="display:none;"></div>
      <hr class="divider">
      <div class="fold">
        <div class="fold-head" onclick="this.nextElementSibling.classList.toggle('collapsed')">➕ 添加剧集 <span class="fold-arrow">▾</span></div>
        <div class="fold-body collapsed">
          <div class="form-row">
            <input class="input" id="s-name" placeholder="想看的剧名" style="flex:2;" />
            <select class="select" id="s-status" style="max-width:90px;"><option>想看</option><option>追更</option><option>已看完</option></select>
            <button class="btn btn-primary" id="s-add">添加</button>
          </div>
        </div>
      </div>
      <ul class="item-list" id="s-list"></ul>
    </div>`;
  enterToSubmit('s-add');
  document.getElementById('s-toggle-rec').onclick = () => {
    const p = document.getElementById('s-rec-panel');
    const l = document.getElementById('s-rec-list');
    const show = p.style.display === 'none';
    p.style.display = show ? 'flex' : 'none';
    l.style.display = show ? 'grid' : 'none';
  };
  document.getElementById('s-add').onclick = async function () {
    const name = document.getElementById('s-name').value.trim();
    if (!name) { toast('请输入剧名'); return; }
    await withBtn(this, async () => {
      try {
        await api('/api/shows', 'POST', { name, status: document.getElementById('s-status').value });
        document.getElementById('s-name').value = '';
        toast('✅ 已添加'); load();
      } catch (e) { toast(e.message); }
    });
  };
  document.getElementById('s-rec').onclick = async function () {
    const kind = document.getElementById('s-kind').value;
    const tag = document.getElementById('s-tag').value;
    const box = document.getElementById('s-rec-list');
    box.innerHTML = `<div style="color:var(--text-light);font-size:13px;padding:10px;">加载中...</div>`;
    await withBtn(this, async () => {
      try {
        const recs = await api(`/api/shows/recommend?kind=${kind}&tag=${encodeURIComponent(tag)}`);
        if (!recs.length) { box.innerHTML = `<div class="empty">暂未获取到推荐</div>`; return; }
        box.innerHTML = recs.map((r, i) => `
          <div class="rec-card">
            ${r.cover ? `<img src="${r.cover}" class="rec-cover" onerror="this.style.display='none'" />` : ''}
            <div class="rec-info">
              <div class="rec-name">${esc(r.title)}</div>
              <div class="rec-rate">⭐ ${r.rate || '暂无'}</div>
            </div>
            <button class="btn btn-primary btn-sm" data-rec="${i}">+ 待看</button>
          </div>`).join('');
        box.querySelectorAll('[data-rec]').forEach(b => b.onclick = async () => {
          const r = recs[b.dataset.rec];
          await api('/api/shows', 'POST', { name: r.title, type: kind === 'movie' ? '电影' : '剧集', status: '想看', source: '豆瓣推荐' });
          toast('✅ 已加入待看'); load();
        });
      } catch (e) { box.innerHTML = `<div class="empty">推荐获取失败</div>`; }
    });
  };
  async function load() {
    const items = await api('/api/shows');
    const list = document.getElementById('s-list');
    if (!items.length) { list.innerHTML = `<div class="empty">剧荒了？点上方获取推荐 🎬</div>`; return; }
    list.innerHTML = items.map((it, i) => `
      <li class="item-card" style="animation-delay:${i * 0.04}s">
        <div class="item-main">
          <div class="item-title">${esc(it.name)} <span class="tag tag-purple">${it.status}</span></div>
          <div class="item-sub">${it.type ? `<span class="tag tag-blue">${esc(it.type)}</span>` : ''}${it.source ? `<span class="tag" style="background:var(--cream);color:var(--text-light)">${esc(it.source)}</span>` : ''}</div>
        </div>
        <button class="del-btn" data-del="${it.id}">🗑</button>
      </li>`).join('');
    list.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { await api('/api/shows?id=' + b.dataset.del, 'DELETE'); load(); });
  }
  load();
};

      ${head('⭐', '剧集影评', '片名 · 评分 · 一句话影评')}
      <div class="fold">
        <div class="fold-head" onclick="this.nextElementSibling.classList.toggle('collapsed')">➕ 写影评 <span class="fold-arrow">▾</span></div>
        <div class="fold-body collapsed">
          <div class="form-row">
            <input class="input" id="r-name" placeholder="电影 / 电视剧名" style="flex:2;" />
            <select class="select" id="r-kind" style="max-width:90px;"><option>电影</option><option>电视剧</option></select>
            <select class="select" id="r-rating" style="max-width:80px;"><option value="3">⭐3</option><option value="1">⭐1</option><option value="2">⭐2</option><option value="4">⭐4</option><option value="5">⭐5</option></select>
            <button class="btn btn-primary" id="r-add">添加</button>

        <button class="btn btn-ghost btn-sm" id="r-filter">筛选</button>

      <ul class="item-list" id="r-list"></ul>

  enterToSubmit('r-add');
  document.getElementById('r-add').onclick = async function () {
    const name = document.getElementById('r-name').value.trim();
    if (!name) { toast('请输入片名'); return; }

      try {
        await api('/api/reviews', 'POST', { name, kind: document.getElementById('r-kind').value, watch_date: todayISO(), rating: parseInt(document.getElementById('r-rating').value), content: document.getElementById('r-content').value });

      <li class="item-card" style="animation-delay:${i * 0.04}s">
        <div class="item-main">
          <div class="item-title">${esc(it.name)} <span class="tag tag-purple">${it.kind}</span> ${it.rating ? `<span class="tag tag-yellow">${'⭐'.repeat(it.rating)}</span></div>
          <div class="item-sub"><span class="tag tag-blue">${fmtMD(it.watch_date)}</span></div>` : '</div>' }

        </div>
        <button class="del-btn" data-del="${it.id}">🗑</button>
      </li>`).join('');

  }
  load();
};

// ── 每日随笔 ──
RENDERERS.notes = async function () {
  const el = document.getElementById('content-area');
  el.innerHTML = `
    <div class="page-card">
      ${head('📝', '每日随笔', '图片日记 · 时间轴 · 可编辑')}
      <button class="btn btn-primary" id="n-toggle" style="width:100%;margin-bottom:14px;">✏️ 写新随笔</button>
      <div id="n-form" style="display:none;margin-bottom:18px;">
        <div class="form-row">
          <input class="input" id="n-title" placeholder="标题（可选）" style="flex:2;" />
          <input class="input" id="n-date" type="date" value="${todayISO()}" style="max-width:140px;" />
          <label class="upload-label" for="n-image">🖼️ 图片</label>
          <input type="file" id="n-image" accept="image/*" style="display:none;" />
        </div>
        <textarea class="textarea" id="n-content" placeholder="今天发生了什么..." style="margin-bottom:10px;"></textarea>
        <div id="n-preview" style="margin-bottom:10px;display:none;"></div>
        <button class="btn btn-primary" id="n-add" style="width:100%;">💾 保存随笔</button>
      </div>
      <div class="filter-bar" style="margin-bottom:14px;">
        <input class="input" id="n-search" placeholder="🔍 搜索关键词" style="flex:2;" />
        <input class="input" id="n-month" type="month" style="max-width:140px;" />
        <button class="btn btn-ghost btn-sm" id="n-filter">筛选</button>
      </div>
      <ul class="timeline" id="n-list"></ul>
    </div>`;
  enterToSubmit('n-add', '#n-form .form-row');
  let img = '';
  let editingId = null;
  let currentNotes = [];
  const formEl = document.getElementById('n-form');
  const toggleBtn = document.getElementById('n-toggle');
  const addBtn = document.getElementById('n-add');

  function resetForm() {
    editingId = null;
    ['n-title', 'n-content'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('n-date').value = todayISO();
    document.getElementById('n-preview').style.display = 'none';
    document.getElementById('n-preview').innerHTML = '';
    document.getElementById('n-image').value = '';
    img = '';
    addBtn.textContent = '💾 保存随笔';
    toggleBtn.textContent = '✏️ 写新随笔';
  }
  toggleBtn.onclick = () => {
    if (formEl.style.display === 'none') { resetForm(); formEl.style.display = 'block'; }
    else { formEl.style.display = 'none'; resetForm(); }
  };
  document.getElementById('n-image').onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    if (f.size > 5 * 1024 * 1024) { toast('图片不能超过5MB'); return; }
    const r = new FileReader();
    r.onload = (ev) => { img = ev.target.result; const p = document.getElementById('n-preview'); p.style.display = 'block'; p.innerHTML = `<img src="${img}" style="max-width:100%;max-height:200px;border-radius:12px;" />`; };
    r.readAsDataURL(f);
  };
  addBtn.onclick = async function () {
    const content = document.getElementById('n-content').value.trim();
    if (!content && !img && !editingId) { toast('请输入内容或图片'); return; }
    const payload = { title: document.getElementById('n-title').value.trim(), content, date: document.getElementById('n-date').value, image: img };
    await withBtn(this, async () => {
      try {
        if (editingId) { await api('/api/notes/' + editingId, 'PUT', payload); toast('✅ 已更新'); }
        else { await api('/api/notes', 'POST', payload); toast('✅ 已保存'); }
        resetForm(); formEl.style.display = 'none'; load();
      } catch (e) { toast(e.message); }
    });
  };
  function openEdit(it) {
    editingId = it.id;
    document.getElementById('n-title').value = it.title || '';
    document.getElementById('n-content').value = it.content || '';
    document.getElementById('n-date').value = it.date || todayISO();
    img = it.image || '';
    const p = document.getElementById('n-preview');
    if (img) { p.style.display = 'block'; p.innerHTML = `<img src="${img}" style="max-width:100%;max-height:200px;border-radius:12px;" />`; }
    else { p.style.display = 'none'; p.innerHTML = ''; }
    document.getElementById('n-image').value = '';
    addBtn.textContent = '💾 更新随笔';
    toggleBtn.textContent = '✏️ 收起编辑';
    formEl.style.display = 'block';
    formEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  document.getElementById('n-filter').onclick = () => load();
  async function load() {
    const q = document.getElementById('n-search').value;
    const month = document.getElementById('n-month').value;
    currentNotes = await api('/api/notes' + (q ? `?q=${encodeURIComponent(q)}` : '') + (month ? (q ? '&' : '?') + `month=${month}` : ''));
    const list = document.getElementById('n-list');
    if (!currentNotes.length) { list.innerHTML = `<div class="empty">还没有随笔，记下今天吧 📔</div>`; return; }
    list.innerHTML = currentNotes.map((it, i) => `
      <li class="timeline-item" style="animation-delay:${i * 0.05}s">
        <div class="timeline-card">
          <div class="timeline-head"><span class="timeline-title">${esc(it.title || '无标题')}</span><span class="tag tag-blue">${relDate(it.date)}</span></div>
          ${it.content ? `<div class="timeline-content ${it.content.length > 100 ? 'clamp' : ''}">${esc(it.content)}</div>${it.content.length > 100 ? '<button class="expand-btn" onclick="this.previousElementSibling.classList.toggle(\'clamp\');this.textContent=this.previousElementSibling.classList.contains(\'clamp\')?\'展开全文 ▾\':\'收起 ▴\'">展开全文 ▾</button>' : ''}` : ''}
          ${it.image ? `<img class="timeline-img" src="${it.image}" onclick="this.classList.toggle('expanded')" onerror="this.style.display='none'" />` : ''}
          <div class="timeline-actions">
            <button class="edit-btn" data-edit="${it.id}" title="编辑">✏️ 编辑</button>
            <button class="del-btn timeline-del" data-del="${it.id}">🗑</button>
          </div>
        </div>
      </li>`).join('');
    list.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { await api('/api/notes?id=' + b.dataset.del, 'DELETE'); if (editingId === b.dataset.del) { resetForm(); formEl.style.display = 'none'; } load(); });
    list.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEdit(currentNotes.find(x => x.id === b.dataset.edit)));
  }
  load();
};

</script>
